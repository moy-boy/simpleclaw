packages:
  - .
  - ui
  - packages/*
  - extensions/anthropic
  - extensions/codex
  - extensions/discord
  - extensions/openai
  - extensions/slack
  - extensions/telegram

minimumReleaseAge: 2880

minimumReleaseAgeExclude:
  - "@openclaw/fs-safe@0.2.7"
  - "@openclaw/proxyline@0.3.3"
  - "tokenjuice"
  - "@agentclientprotocol/sdk"
  - "hono"
  - "protobufjs"
  - "vite"
  - "@hono/node-server"
  - "@mariozechner/*"
  - "@aws-sdk/client-bedrock-runtime@3.1051.0"
  - "@aws-sdk/core"
  - "@aws-sdk/token-providers@3.1051.0"
  - "@copilotkit/aimock@1.27.0"
  - "@earendil-works/pi-agent-core"
  - "@earendil-works/pi-ai"
  - "@earendil-works/pi-coding-agent"
  - "@earendil-works/pi-tui"
  - "@openai/codex"
  - "@typescript/native-preview*"
  - "@types/node"
  - "@rolldown/*"
  - "@oxlint/*"
  - "@oxfmt/*"
  - "@oxc-project/types"
  - "oxfmt"
  - "discord-api-types"
  - "rolldown"
  - "sqlite-vec"
  - "sqlite-vec-*"

nodeLinker: hoisted
blockExoticSubdeps: true

overrides:
  "@anthropic-ai/sdk": 0.97.1
  hono: 4.12.18
  "@hono/node-server": 1.19.14
  "@aws-sdk/client-bedrock-runtime": 3.1051.0
  fast-uri: 3.1.2
  defu: 6.1.5
  fast-xml-parser: 5.7.0
  file-type: 22.0.1
  ip-address: 10.2.0
  lru-cache: 11.5.0
  minimatch: 10.2.5
  path-to-regexp: 8.4.0
  qs: 6.14.2
  node-domexception: "npm:@nolyfill/domexception@1.0.28"
  typebox: 1.1.38
  tar: 7.5.15
  tough-cookie: 4.1.3
  protobufjs: 8.4.0

allowBuilds:
  "@openclaw/fs-safe": true
  "@google/genai": true
  "@lydell/node-pty": true
  "@napi-rs/canvas": true
  "@discordjs/opus": false
  esbuild: true
  koffi: false
  protobufjs: true
  tree-sitter-bash: false
  "@openclaw/proxyline": true

packageExtensions:
  "@earendil-works/pi-coding-agent":
    dependencies:
      strip-ansi: 7.2.0

peerDependencyRules:
  allowedVersions:
    "prism-media>opusscript": "^0.0.8 || ^0.1.1"
